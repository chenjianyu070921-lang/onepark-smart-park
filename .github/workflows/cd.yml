name: CD

# 构建并推送各业务服务镜像到镜像仓库.
# 默认推送到 GitHub Container Registry(ghcr.io/<owner>/onepark/<svc>:latest),
# 使用内置 GITHUB_TOKEN, 无需额外密钥. 如需推送到私有仓库(如 docker.io / 阿里云 ACR),
# 修改下方 env.REGISTRY 并在需要时补充对应的 docker/login-action 步骤(使用相应 secret).
on:
  push:
    branches: [main, master, hanxia]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_PREFIX: onepark

jobs:
  build-and-push:
    name: build & push image
    runs-on: ubuntu-latest
    # ghcr 推送需要 packages 写权限; GITHUB_TOKEN 默认对 ghcr 生效.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: device-service
            SVC_DIR: app/device-service
            MAIN: device.go
            PORT: "8001"
            CFG: device-api.yaml
          - service: user-manage
            SVC_DIR: app/user-manage
            MAIN: usermanage.go
            PORT: "8086"
            CFG: usermanage-api.yaml
          - service: gateway
            SVC_DIR: gateway
            MAIN: apigateway.go
            PORT: "8080"
            CFG: apigateway-api.yaml
          - service: auth-service
            SVC_DIR: app/auth-service
            MAIN: auth.go
            PORT: "8088"
            CFG: auth-api.yaml
          - service: workorder-service
            SVC_DIR: app/workorder-service
            MAIN: workorder.go
            PORT: "8082"
            CFG: workorder-api.yaml
          - service: alarm-service
            SVC_DIR: app/alarm-service
            MAIN: alarm.go
            PORT: "8009"
            CFG: alarm-api.yaml
          - service: dispatch-service
            SVC_DIR: app/dispatch-service
            MAIN: dispatch.go
            PORT: "8053"
            CFG: dispatch-api.yaml
          - service: leasing-service
            SVC_DIR: app/leasing-service
            MAIN: leasing.go
            PORT: "8051"
            CFG: leasing-api.yaml
          - service: dashboard-service
            SVC_DIR: app/dashboard-service
            MAIN: dashboard.go
            PORT: "8052"
            CFG: dashboard-api.yaml
          - service: billing-service
            SVC_DIR: app/billing-service
            MAIN: billing.go
            PORT: "8063"
            CFG: billing-api.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 复用仓库根统一参数化 Dockerfile(见 Dockerfile / deploy/docker-compose.yml).
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          build-args: |
            SVC_DIR=${{ matrix.SVC_DIR }}
            MAIN=${{ matrix.MAIN }}
            PORT=${{ matrix.PORT }}
            CFG=${{ matrix.CFG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
