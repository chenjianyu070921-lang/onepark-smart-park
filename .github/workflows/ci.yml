name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    name: test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # 仓库为 go workspace(go.work), 需逐模块执行 test/build.
      - name: Test
        run: |
          find . -name go.mod -not -path '*/vendor/*' | while read -r m; do
            d=$(dirname "$m")
            echo "== test $d =="
            (cd "$d" && go test ./...) || exit 1
          done
      - name: Build
        run: |
          find . -name go.mod -not -path '*/vendor/*' | while read -r m; do
            d=$(dirname "$m")
            echo "== build $d =="
            (cd "$d" && go build ./...) || exit 1
          done
