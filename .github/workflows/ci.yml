name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    name: test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # 仓库为 go workspace(go.work), 需逐模块执行 test/build.
      - name: Test
        run: |
          find . -name go.mod -not -path '*/vendor/*' | while read -r m; do
            d=$(dirname "$m")
            echo "== test $d =="
            (cd "$d" && go test ./...) || exit 1
          done
      - name: Build
        run: |
          find . -name go.mod -not -path '*/vendor/*' | while read -r m; do
            d=$(dirname "$m")
            echo "== build $d =="
            (cd "$d" && go build ./...) || exit 1
          done

  # M6-P2: 明文密钥/硬编码凭据扫描. 默认仅扫描 PR/push 的增量 diff, 不翻历史, 避免误伤 docs 示例.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
