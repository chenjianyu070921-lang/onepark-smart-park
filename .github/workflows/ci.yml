name: ci

# 构建/测试/静态检查流水线(与 gate-audit.yml 的 PR 闸门审计互补:
# gate-audit 只卡讲解卡, 本流水线才真正跑 build/test/vet/lint/bench/镜像构建).
#
# 注: 本仓库是多模块 go.work 工作区, 根目录非 module. 部分 go 版本下 `go build ./...`
# 会因"目录前缀 . 不含模块"报错, 故统一用 `./app/*/... ./common/*/...` 等按模块模式
# (CI 默认 bash, `*` 由 shell 展开为各模块路径, 等价于逐模块 ./...).
on:
  push:
  pull_request:

jobs:
  build-test-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./app/*/... ./common/*/... ./gateway/... ./proto/...

      - name: Test
        run: go test ./app/*/... ./common/*/... ./gateway/... ./proto/... -count=1

      - name: Vet
        run: go vet ./app/*/... ./common/*/... ./gateway/... ./proto/...

  # 静态检查: 拉取 .golangci.yml 配置的 linter 集合. 当前设为 continue-on-error,
  # 仅暴露存量问题、不阻断主干(存量清零后可去掉该选项转为强卡).
  golangci:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # 测试覆盖率: 生成 profile 并打印各包覆盖率, 上传原始文件供 Codecov 等消费.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./app/*/... ./common/*/... ./gateway/... ./proto/... -count=1
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # 压测: 跑 common 薄封装基准(纯函数/编码层/进程内 miniredis, 不依赖外部 broker).
  # 注意: go.work 下 `-bench` 模式会误编译工作区根(无 .go), 故逐包进入包目录用 `go test .` 执行.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Benchmark common
        run: |
          cd common
          for d in datascope kafka mqtt tdengine tokenblk jwt redisx ctxdata; do
            echo "==== $d ===="
            (cd "$d" && go test -run='^$' -bench=Benchmark -benchmem .)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bench-common
          path: common/common-bench.log
          if-no-files-found: ignore

  # 镜像构建与导出: 用 docker compose 构建全部服务镜像并导出 tar 产物(无推送, 需 registry 时再接 push).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose -f deploy/docker-compose.yml build
      - name: Export app images
        run: docker save $(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^onepark/') -o onepark-images.tar
      - uses: actions/upload-artifact@v4
        with:
          name: onepark-images
          path: onepark-images.tar
          if-no-files-found: ignore
