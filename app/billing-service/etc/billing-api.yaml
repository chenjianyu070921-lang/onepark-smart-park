Name: billing-api
Host: 0.0.0.0
Port: 8063

# MySQL: 组内公用库 onepark-smart-park(计费规则表 billing_rule、账单表 bill 都在里面)
MySQL:
  DataSource: root:4ay1nkal3u8ed77y@tcp(115.191.16.159:3306)/onepark-smart-park?charset=utf8mb4&parseTime=true&loc=Local

# Redis: 月度自动出账的分布式锁防重(复用 leasing 模式)
Redis:
  Addr: ${REDIS_ADDR}
  Pass: ${REDIS_PASS}
  DB: 0

# 自动出账时能耗读数未携带租户(历史/M4 未回填), 统一落到该兜底园区
DefaultTenantId: 1

# 月度自动出账定时任务(复用 leasing 的 Redis 锁防重模式)
# 默认关闭, 部署时显式开启; 每月 1 日 02:02 出上月账
MonthlyCron:
  Enabled: true
  Spec: "0 2 1 * *"

# gRPC 双模入口(与 REST 同进程): 补齐原"仅 Ping"死契约的业务 rpc,
# 供内部服务/网关调用计费规则、账单与出账能力.
# 留空则不启动 gRPC(纯 HTTP); 生产/联调建议启用.
Grpc:
  ListenOn: ${BILLING_GRPC_LISTEN} # 如 0.0.0.0:18063
