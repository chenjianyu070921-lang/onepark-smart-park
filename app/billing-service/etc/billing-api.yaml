Name: billing-api
Host: 0.0.0.0
Port: 8063

# MySQL: 组内公用库 onepark-smart-park(计费规则表 billing_rule、账单表 bill 都在里面)
MySQL:
  DataSource: root:4ay1nkal3u8ed77y@tcp(115.191.16.159:3306)/onepark-smart-park?charset=utf8mb4&parseTime=true&loc=Local

# Redis: 缓存规则列表
Redis:
  Host: 127.0.0.1:6379
  Type: node
  Pass: ""

# 定时出账: 接口61 的定时触发, 每月固定日子给上个自然月的用量出账单
# 服务启动时会先跑一次(补上可能漏掉的账期), 之后每小时检查一次
# 同一个账期只会出一次; 手动调 /api/billing/generate 出过的账, 定时不会重复出
BillJob:
  Enable: true
  # 每月几号出账(1~28, 别填 29~31, 有的月份没有这一天)
  DayOfMonth: 1
