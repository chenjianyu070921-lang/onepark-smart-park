Name: notice-api
Host: 0.0.0.0
Port: 8094

# MySQL 连接配置 (DSN 由环境变量注入)
MySQL:
  DataSource: ${NOTICE_MYSQL_DSN}

# Redis 连接配置
Redis:
  Addr: ${REDIS_ADDR}
  Pass: ${REDIS_PASS}
  DB: 0

# Kafka 连接配置
# 生产: 公告发布时投递 notice-event
# 消费: 消费 workorder-event 生成站内通知(Topic/Group/Enabled)
# ⚠️ 共享 broker 上 Group 严禁与其它项目/环境重名; Enabled 默认 false, 部署时显式开启.
# 本期按部署要求显式置 true: 消费 workorder-event 实时生成站内通知(notice + notice_read 送达记录),
# 仅在确认 Group(m2-notice-dev-liu)不与其它项目/环境重名、且 KAFKA_BROKERS 已指向正确 broker 时开启.
Kafka:
  Brokers: ${KAFKA_BROKERS}
  Topic: workorder-event
  Group: m2-notice-dev-liu
  Enabled: true

# 定时发布调度(P1): 到达 publish_at 的草稿公告自动发布并投递 notice-event.
# 与 Kafka 消费一致的共享环境纪律: Enabled 默认 false, 部署时显式开启.
PublishCron:
  Enabled: true
  Spec: "*/1 * * * *"

# 公告推送消费配置: 消费 notice-event → Redis PubSub 推送在线用户(公告实时触达).
# ⚠️ Group 严禁与其它项目/环境重名; Enabled 默认 false, 部署时确认后显式开启.
NoticeEvent:
  Brokers: ${KAFKA_BROKERS}
  Topic: notice-event
  Group: m2-notice-push-dev-liu
  Enabled: true
