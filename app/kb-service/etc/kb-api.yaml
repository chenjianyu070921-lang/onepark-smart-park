Name: kb-api
Host: 0.0.0.0
Port: 8071

# ===== MySQL =====
# DSN 一律由环境变量注入(K8s: onepark-secrets; 本地原生运行需自行 export):
#   KB_MYSQL_DSN='root:onepark123@tcp(127.0.0.1:3306)/kb_db?charset=utf8mb4&parseTime=True&loc=Local'
MySQL:
  DataSource: "${KB_MYSQL_DSN}"

# ===== 检索引擎 =====
# Engine 目前只实现 keyword(Go 侧 BM25); vector 预留给向量库实现(见 internal/retriever)。
# 两个阈值是"拒答"的两道闸, 都用评测集(18 题: 10 个应有依据 + 8 个应拒答)校准过:
#   MinScore 管"覆盖得够不够"(只命中一个泛词也能满分的情况由 MinTerms 兜住)
#   MinTerms 管"证据够不够"(至少 2 个实词同时命中才算有关联)
Retrieval:
  Engine: keyword
  TopK: 3          # 默认取前几段
  MinScore: 0.35   # 命中分数下限(评测集标定, 见 config.go 注释), 低于它视为"没有依据"(宁可拒答, 不要幻觉)
  MinTerms: 2      # 至少命中 2 个实词元才算有关联(疑问词/泛词已在查询侧滤掉)
  MaxScan: 5000    # 单次检索最多加载的切片数(演示语料远小于此; 换向量检索后此项废弃)

# ===== 大模型(可选) =====
# Enable=false 或 key 为空 -> 走抽取式回答, 功能完整可用、答辩不受网络影响。
# 填上 key(建议用环境变量注入, 别提交)后自动升级为生成式:
#   KB_LLM_API_KEY=xxx  KB_LLM_ENABLE=true
# 各家 OpenAI 兼容端点示例(与 M4 智能体服务同一套约定):
#   DeepSeek  https://api.deepseek.com/v1                          deepseek-chat
#   火山方舟   https://ark.cn-beijing.volces.com/api/coding/v1      deepseek-v4-flash-ga-260731
#   通义千问   https://dashscope.aliyuncs.com/compatible-mode/v1    qwen-plus
LLM:
  Enable: false
  BaseURL: "https://ark.cn-beijing.volces.com/api/coding/v1"
  APIKey: "${KB_LLM_API_KEY}"
  Model: "deepseek-v4-flash-ga-260731"
  Timeout: 20      # 秒; 超时即回退抽取式, 不阻塞问答
