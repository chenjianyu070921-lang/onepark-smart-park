Name: auth-api
Host: 0.0.0.0
Port: 8088

# JWT 签名密钥: 必须来自环境变量, 禁止硬编码 (为空启动即 panic).
JwtSecret: ${JWT_SECRET}
# access / refresh 令牌有效期(秒)
JwtExpire: 7200
JwtRefresh: 86400

# 初始用户(演示用, 生产应接入用户中心/DB).
# Password 明文仅本地演示, 启动时转 sha256; 也可直接给 PasswordHash(sha256 hex).
Users:
  - Username: admin
    Password: "admin123"
    RoleIds: "1"
    TenantId: 1
