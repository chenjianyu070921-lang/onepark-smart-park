Name: energydata-api
Host: 0.0.0.0
Port: 8061

# gRPC: 接口54 给 M5 大屏调用(GetDailyReport)
RPC:
  Name: energydata-rpc
  ListenOn: 0.0.0.0:9061
  Mode: dev

# MySQL: 写入方为 M4, 表(energy_reading)落 billing_db(见 deploy/sql/m2_energy_reading.sql);
# 部署时通过 ENERGY_DATA_MYSQL_DSN 注入 billing_db 连接串(与计费同库).
MySQL:
  DataSource: ${ENERGY_DATA_MYSQL_DSN}

# Redis: 缓存实时能耗(接口52)
Redis:
  Host: ${REDIS_ADDR}
  Type: node
  Pass: ${REDIS_PASS}

# Kafka: 消费 M1 上报的设备遥测数据(接口55)
Kafka:
  Brokers: ${KAFKA_BROKERS}
  Topic: onepark.device.telemetry
  Group: energy-data-group
