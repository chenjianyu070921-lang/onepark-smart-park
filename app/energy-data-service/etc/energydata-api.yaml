Name: energydata-api
Host: 0.0.0.0
Port: 8061

# gRPC: 接口54 给 M5 大屏调用(GetDailyReport)
RPC:
  Name: energydata-rpc
  ListenOn: 0.0.0.0:9061
  Mode: dev

# MySQL: 组内公用库 onepark-smart-park(本机 Navicat 连的那个)
# 若改用 docker 环境, 把 127.0.0.1:3306 换成 mysql:3306, 密码换成 .env 里的 MYSQL_ROOT_PASSWORD
MySQL:
  DataSource: root:4ay1nkal3u8ed77y@tcp(115.191.16.159:3306)/onepark-smart-park?charset=utf8mb4&parseTime=true&loc=Local

# Redis: 缓存实时能耗(接口52)
Redis:
  Host: 127.0.0.1:6379
  Type: node
  Pass: ""

# Kafka: 消费 M1 上报的设备遥测数据(接口55)
# Topic 不需要配: 代码直接取 common/kafka.TopicDeviceTelemetry(当前是 device-telemetry),
# 和 M1 的 device-service / event-dispatcher 用的是同一个常量, 不会再出现两边对不上。
# 本地联调要换 topic 时, 把下面 Topic 那行的注释打开覆盖即可。
Kafka:
  Brokers:
    - 127.0.0.1:9092
  # Topic: device-telemetry
  Group: energy-data-group

# 设备既没上报 zone_id、device 表也查不到 building_id 时, 归入这个区域
# 兜底而不是丢弃: 数据不丢, 看到日报里"未分配"有量就知道要去 device 表补归属
DefaultZone: 未分配
