Name: workorder-api
Host: 0.0.0.0
Port: 8091

# MySQL 连接配置 (DSN 由环境变量注入)
MySQL:
  DataSource: ${WORKORDER_MYSQL_DSN}

# Redis 连接配置
Redis:
  Addr: ${REDIS_ADDR}
  Pass: ${REDIS_PASS}
  DB: 0

# Kafka 连接配置
# 生产: 建单/派单/状态流转发 workorder-event
# 消费: 消费 alarm-event 自动建报修工单(Topic/Group/Enabled)
# ⚠️ 共享 broker 上 Group 严禁与其它项目/环境重名; Enabled 默认 false, 部署时显式开启.
# 本期按部署要求显式置 true: 消费者会在消费到告警时自动建真实报修工单,
# 仅在确认 Group(m2-workorder-dev-liu)不与其它项目/环境重名、且 KAFKA_BROKERS 已指向正确 broker 时开启.
Kafka:
  Brokers: ${KAFKA_BROKERS}
  Topic: alarm-event
  Group: m2-workorder-dev-liu
  Enabled: true
  # 告警未携带 tenant_id 时的建单兜底园区
  DefaultTenantId: 1

# 工单超时升级定时任务(复用 leasing 的 Redis 锁防重模式).
# 默认关闭, 部署时显式开启; 把超过 PendingTimeoutHours 小时仍活跃且非紧急的工单自动升级为紧急.
EscalationCron:
  Enabled: true
  Spec: "*/30 * * * *"
  PendingTimeoutHours: 24

# MinIO 对象存储(工单附件上传)
# Endpoint 为空时附件上传接口返回"对象存储未配置"; 部署时通过环境变量注入远端 MinIO 凭据.
MinIO:
  Endpoint: ${WORKORDER_MINIO_ENDPOINT}
  AccessKey: ${WORKORDER_MINIO_ACCESS_KEY}
  SecretKey: ${WORKORDER_MINIO_SECRET_KEY}
  Bucket: workorder
  UseSSL: false
  PublicBaseURL: ${WORKORDER_MINIO_PUBLIC_URL}
