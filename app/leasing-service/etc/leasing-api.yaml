Name: leasing-api
Host: 0.0.0.0
Port: 8051

# ===== MySQL =====
# DSN 一律由环境变量注入(compose: LEASING_MYSQL_DSN; K8s: onepark-secrets)。
# 本地原生运行(不经容器)需自行 export, 例:
#   LEASING_MYSQL_DSN='root:onepark123@tcp(127.0.0.1:3306)/leasing_db?charset=utf8mb4&parseTime=True&loc=Local'
MySQL:
  DataSource: "${LEASING_MYSQL_DSN}"

# ===== Redis =====
# 地址/密码走环境变量(compose: REDIS_ADDR/REDIS_PASS)。
# 注意: DB 必须是数字字面量, 写成 ${REDIS_DB} 会被展开成字符串导致 int 字段类型不匹配。
Redis:
  Addr: "${REDIS_ADDR}"
  Pass: "${REDIS_PASS}"
  DB: 0

# ===== JWT 鉴权 =====
# 为空 = 放行(开发联调期; 中间件会打告警日志), 不改变现有调用方式。
# 部署时填 ${JWT_SECRET} —— 注意 go-zero 的 ${} 需 main 使用 conf.UseEnv() 才展开,
# 否则会保留字面量, 故也可直接写密钥。
JwtSecret: ""
