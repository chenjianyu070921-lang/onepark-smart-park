Name: visitor-api
Host: 0.0.0.0
Port: 8083

# MySQL 连接配置 (DSN 由环境变量注入)
MySQL:
  DataSource: ${VISITOR_MYSQL_DSN}

# Redis 连接配置
Redis:
  Addr: ${REDIS_ADDR}
  Pass: ${REDIS_PASS}
  DB: 0

# Kafka 连接配置 (预留, 用于访客事件投递)
Kafka:
  Brokers: ${KAFKA_BROKERS}

# M1 device-service gRPC(访客签入开门联动); NonBlock 允许 M1 未就绪时启动, 调用失败降级
DeviceRPC:
  Endpoints:
    - ${DEVICE_RPC_ENDPOINTS:-127.0.0.1:9001}
  NonBlock: true

# 门岗开门设备(M1 设备中心注册的 device_id 与开门指令名)
Door:
  DeviceID: gate-main-01
  Command: open_door

# 访客二维码签名盐(配置中心注入, 缺省 onepark-m2-visitor)
QrSignSalt: onepark-m2-visitor
