Name: device-api
Host: 0.0.0.0
Port: 8001

# 环境变量占位, 由 ServiceContext 通过 os.ExpandEnv 注入, 禁止写明文密码/公网地址
MySQL:
  DataSource: "${MYSQL_DSN}"
  MaxOpenConns: 20
  MaxIdleConns: 10

Redis:
  Host: "${REDIS_HOST}"
  Type: node

# M1 对外 gRPC (SendCommand / GetDevice), 直连模式, 不依赖 Etcd
Rpc:
  ListenOn: 0.0.0.0:9001
  Timeout: 3000

KafkaBrokers: "${KAFKA_BROKERS}"

# 指令下行通道(EMQX); Broker 为空时降级为仅落库
MQTT:
  Broker: "${EMQX_BROKER}"
  ClientId: "${EMQX_CLIENT}"
  Username: "${EMQX_USERNAME}"
  Password: "${EMQX_PASSWORD}"

# 遥测时序落库(taosAdapter REST); Endpoint 为空时跳过
TDengine:
  Endpoint: "${TDENGINE_REST}"
  Token: "${TDENGINE_TOKEN}"
  Database: onepark_ts
  Timeout: 3000

# HTTP 鉴权密钥; 为空时放行(M6 认证服务就绪前保持可联调)
JwtSecret: "${JWT_SECRET}"

# 指令超时(秒)、超时扫描周期(秒)、单轮扫描批量、最大重发次数
CommandTimeoutSec: 30
TimeoutScanIntervalSec: 15
TimeoutScanBatchLimit: 200
CommandMaxResend: 2
