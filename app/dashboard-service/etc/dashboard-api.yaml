Name: dashboard-api
Host: 0.0.0.0
Port: 8052

# ===== MySQL =====
# 本地开发默认值(dashboard_db)。部署环境请改回 ${DASHBOARD_MYSQL_DSN} 形式由环境变量注入。
MySQL:
  DataSource: "root:onepark123@tcp(127.0.0.1:3306)/dashboard_db?charset=utf8mb4&parseTime=True&loc=Local"

# ===== Redis (聚合缓存) =====
# 本地开发默认值。部署环境请改回 ${REDIS_ADDR} / ${REDIS_PASS} 形式。
# 注意: DB 必须是数字字面量, 写成 ${REDIS_DB} 会被展开成字符串导致 int 字段类型不匹配。
# 注意: 宿主机 6379 被原生 redis-server 占用, 这里用 6380 指向 onepark-redis 容器。
Redis:
  Addr: "127.0.0.1:6380"
  Pass: "onepark123"
  DB: 0

# ===== 上游 gRPC 依赖(四路聚合数据源) =====
# 直连 Endpoints(各上游均无 Etcd 注册, 端口取自其各自 etc 配置)。
# NonBlock=true: 上游未启动时不阻塞本服务启动, 调用失败由聚合层逐源降级为 null。
# 未配置的那一路会自动退化为降级占位, 不会导致启动失败。

# M1 device-service 设备卡片 (app/device-service/etc/device-api.yaml: Rpc.ListenOn 0.0.0.0:9001)
# 注意: 该服务的 REST(8001) 与 gRPC(9001) 由同一个进程启动, 这里连的是 gRPC 口。
Device:
  Endpoints:
    - 127.0.0.1:9001
  NonBlock: true
  Timeout: 600

# M2 workorder-service 工单卡片 (app/workorder-service/etc/workorder-grpc.yaml)
Workorder:
  Endpoints:
    - 127.0.0.1:9091
  NonBlock: true
  Timeout: 600

# M3 alarm-service 告警卡片 (app/alarm-service/etc/alarm-grpc.yaml: ListenOn 0.0.0.0:9009)
Alarm:
  Endpoints:
    - 127.0.0.1:9009
  NonBlock: true
  Timeout: 600

# M4 energy-data-service 能耗卡片 (app/energy-data-service/etc/energydata-api.yaml: RPC.ListenOn 0.0.0.0:9061)
Energy:
  Endpoints:
    - 127.0.0.1:9061
  NonBlock: true
  Timeout: 600

# ===== Kafka 大屏事件增量推送(组长计划书 周四 P0) =====
# 消费告警/工单事件 -> WebSocket 广播增量 + 失效聚合缓存(使下一次 5s 快照读到最新值)。
#
# ⚠️ 默认关闭(Enabled: false)。开启前必须确认四件事:
#   0) **先经组长授权** —— 若 broker 开启 auto.create.topics.enable, 消费一个不存在的 topic
#      会**隐式创建 topic**, 这属于向共享基础设施写入, 需先获得同意
#   1) 目标 topic 存在且属于 onepark 体系 —— 共享 broker 上还有其它项目的 topic, 禁止跨项目读写
#   2) 消费组必须与生产方(M2 workorder-service / M3 alarm-service)不同名:
#      Kafka 位移按 (group, topic) 提交, 重名会把它们该消费的消息吃掉。本服务是"旁听者",
#      用自己独立的 group(下面 Group + topic 名拼接)。
#   3) 注意 common/kafka 的 NewConsumer 固定 StartOffset=FirstOffset —— 新消费组会
#      **从最早位移开始消费**, broker 上有积压时会一次性全部推给大屏(仅推送与失效缓存,
#      不会写库, 影响面小于 dispatch 的自动建单, 但仍应知悉)。
Kafka:
  Brokers: ""                       # 本地开发时填真实地址; 不入库共享 broker 公网 IP
  Topics:                          # 必须显式列出, 代码不猜默认值(共享 broker 上猜错就读别人的消息)
    - alarm-event                  # M3 生产的告警事件(供大屏告警卡片实时刷新)
    - workorder-event              # M2 生产的工单事件(common/kafka 注释标明 M5 消费)
  Group: m5-dashboard-dev
  Enabled: false

# ===== JWT 鉴权 =====
# 为空 = 放行(开发联调期; 中间件会打告警日志)。
# 填上后 /ws/dashboard 的 ?token= 会被真正校验(浏览器无法给 WS 握手设 Authorization 头,
# 故 common/middleware 的 extractToken 已支持从 query 取 token)。
JwtSecret: ""
