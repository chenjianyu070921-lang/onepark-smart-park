Name: usermanage-api
Host: 0.0.0.0
Port: 8086

MySQL:
  # 容器内主机名由 docker-compose 注入(MYSQL_HOST=mysql), 本地未设置时回退 127.0.0.1; 库名 sys_db(见 deploy/sql/sys.sql).
  DataSource: "root:${MYSQL_ROOT_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=true&loc=Local"
  MaxOpenConns: 20
  MaxIdleConns: 10

# 双模 gRPC(可选): 配置后同进程额外起 gRPC server, 供网关 RBAC 调用 CheckPermission.
# 为空(未注入 USER_GRPC_ADDR)则仅暴露 HTTP(网关行为不变, RBAC 不生效). 由 compose 注入.
Grpc:
  ListenOn: ${USER_GRPC_ADDR}
