    networks: [onepark]

  # ---- 初始化: 将网关上游表发布到 Nacos 配置中心(幂等, 失败不阻断) ----
  nacos-init:
    image: curlimages/curl:latest
    container_name: onepark-nacos-init
    restart: "no"
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./nacos:/data:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Nacos Basic Auth 凭据: 默认 nacos/nacos(dev), 生产请通过环境变量覆盖.
        creds="$${NACOS_USERNAME:-nacos}:$${NACOS_PASSWORD:-nacos}"
        for i in $$(seq 1 30); do
          code=$$(curl -s -o /dev/null -w "%{http_code}" -u "$$creds" "http://nacos:8848/nacos/v1/cs/configs?dataId=gateway-upstreams&group=$${NACOS_GROUP:-DEFAULT_GROUP}")
          if [ "$$code" = "200" ]; then echo "gateway-upstreams already exists"; exit 0; fi
          if curl -s -u "$$creds" -X POST "http://nacos:8848/nacos/v1/cs/configs" \
               --data-urlencode "dataId=gateway-upstreams" \
               --data-urlencode "group=$${NACOS_GROUP:-DEFAULT_GROUP}" \
               --data-urlencode "content@/data/gateway-upstreams.json"; then
            echo "published gateway-upstreams to nacos"; exit 0
          fi
          echo "retry $$i publish gateway-upstreams..."; sleep 3
        done
        echo "WARN: failed to publish gateway-upstreams (gateway falls back to static yaml)"; exit 0
