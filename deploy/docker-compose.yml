# OnePark 智慧园区 - 一键开发环境(中间件 + 业务服务 device-service)
# 启动: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example up -d
# 查看健康: docker compose -f deploy/docker-compose.yml ps
# 停止: docker compose -f deploy/docker-compose.yml down
networks:
  onepark:
    driver: bridge

volumes:
  mysql-data:
  tdengine-data:
  redis-data:
  kafka-data:
  emqx-data:
  emqx-log:
  minio-data:
  es-data:
  nacos-data:

services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: onepark-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./sql/sys.sql:/docker-entrypoint-initdb.d/sys.sql:ro
    networks: [onepark]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:${REDIS_VERSION}
    container_name: onepark-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks: [onepark]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  tdengine:
    image: tdengine/tdengine:${TDENGINE_VERSION}
    container_name: onepark-tdengine
    restart: unless-stopped
    environment:
      TAOS_FQDN: tdengine
      TAOS_PASSWORD: ${TDENGINE_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${TDENGINE_PORT}:6030"
      - "${TDENGINE_REST_PORT}:6041"
    volumes:
      - tdengine-data:/var/lib/taos
    networks: [onepark]
    healthcheck:
      test: ["CMD", "taos", "-s", "SHOW DATABASES"]
      interval: 15s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:${KAFKA_VERSION}
    container_name: onepark-kafka
    restart: unless-stopped
    environment:
      # KRaft 模式, 不依赖 ZooKeeper
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${KAFKA_PORT}:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10

  emqx:
    image: emqx/emqx:${EMQX_VERSION}
    container_name: onepark-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: onepark
      EMQX_HOST: emqx
    ports:
      - "${EMQX_MQTT_PORT}:1883"      # MQTT
      - "${EMQX_WS_PORT}:8083"         # MQTT/WS
      - "${EMQX_DASHBOARD_PORT}:18083" # Dashboard
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks: [onepark]
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:${NACOS_VERSION}
    container_name: onepark-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 512m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_VALUE}
    ports:
      - "${NACOS_HTTP_PORT}:8848"
      - "${NACOS_GRPC_PORT}:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio:
    image: coollabsio/minio:latest
    container_name: onepark-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:${ES_VERSION}
    container_name: onepark-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      ELASTIC_PASSWORD: ${ES_PASSWORD}
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---- 业务服务: device-service (M1 设备管理, 依赖 MySQL + Redis) ----
  device-service:
    build:
      context: ..                 # 仓库根, 保证 go.work 全模块可见
      dockerfile: Dockerfile       # 仓库根统一参数化模板
      args:
        SVC_DIR: app/device-service
        MAIN: device.go
        PORT: 8001
        CFG: device-api.yaml
    image: onepark/device-service:latest
    container_name: onepark-device-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 容器内中间件主机名固定为服务名; 敏感值来自 .env.example
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-device_db}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${DEVICE_SERVICE_PORT:-8001}:8001"
    networks: [onepark]
    healthcheck:
      # go-zero rest 无内置 /ping, 探测根路径(服务监听即返回 HTTP 响应)作为存活探针.
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 业务服务: user-manage (M2 用户管理 RBAC, 依赖 MySQL) ----
  user-manage:
    build:
      context: ..
      dockerfile: Dockerfile       # 仓库根统一参数化模板
      args:
        SVC_DIR: app/user-manage
        MAIN: usermanage.go
        PORT: 8086
        CFG: usermanage-api.yaml
    image: onepark/user-manage:latest
    container_name: onepark-user-manage
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sys_db}
    ports:
      - "${USER_MANAGE_PORT:-8086}:8086"
    networks: [onepark]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 对外统一入口: gateway (apigateway, 端口 8080) ----
  # 上游地址通过 Nacos 配置中心动态拉取(见 deploy/nacos/gateway-upstreams.json);
  # 未配置 NACOS_ADDRESS 时回退到静态 apigateway-api.yaml(本地联调行为不变).
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: gateway
        MAIN: apigateway.go
        PORT: 8080
        CFG: apigateway-api.yaml
    image: onepark/gateway:latest
    container_name: onepark-gateway
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
      user-manage:
        condition: service_healthy
    environment:
      # 启用 Nacos 动态上游: 网关从 Nacos 拉取 gateway-upstreams 并支持热更新.
      NACOS_ADDRESS: ${NACOS_ADDRESS:-nacos:8848}
      NACOS_NS: ${NACOS_NS:-onepark}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      # 网关鉴权密钥必须与 auth-service 的 JWT_SECRET 一致, 否则无法校验 Token.
      AUTH_SECRET: ${JWT_SECRET}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks: [onepark]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 鉴权服务: auth-service (M6, 端口 8088, 依赖 MySQL sys_db) ----
  auth-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: app/auth-service
        MAIN: auth.go
        PORT: 8088
        CFG: auth-api.yaml
    image: onepark/auth-service:latest
    container_name: onepark-auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_MYSQL_DSN: ${AUTH_MYSQL_DSN}
    ports:
      - "${AUTH_SERVICE_PORT:-8088}:8088"
    networks: [onepark]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 初始化: 将网关上游表发布到 Nacos 配置中心(幂等, 失败不阻断) ----
  nacos-init:
    image: curlimages/curl:latest
    container_name: onepark-nacos-init
    restart: "no"
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./nacos:/data:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $(seq 1 30); do
          code=$(curl -s -o /dev/null -w "%{http_code}" -u "$${NACOS_USERNAME:-nacos}:$${NACOS_PASSWORD:-nacos}" "http://nacos:8848/nacos/v1/cs/configs?dataId=gateway-upstreams&group=$${NACOS_GROUP:-DEFAULT_GROUP}")
          if [ "$$code" = "200" ]; then echo "gateway-upstreams already exists"; exit 0; fi
          if curl -s -u "$${NACOS_USERNAME:-nacos}:$${NACOS_PASSWORD:-nacos}" -X POST "http://nacos:8848/nacos/v1/cs/configs" \
               --data-urlencode "dataId=gateway-upstreams" \
               --data-urlencode "group=$${NACOS_GROUP:-DEFAULT_GROUP}" \
               --data-urlencode "content@/data/gateway-upstreams.json"; then
            echo "published gateway-upstreams to nacos"; exit 0
          fi
          echo "retry $$i publish gateway-upstreams..."; sleep 3
        done
        echo "WARN: failed to publish gateway-upstreams (gateway falls back to static yaml)"; exit 0
