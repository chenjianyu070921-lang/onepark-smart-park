# OnePark 智慧园区 - 中间件环境
# 一键启动: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# 一键停止: docker compose -f deploy/docker-compose.yml down
name: onepark

networks:
  onepark:
    driver: bridge

volumes:
  mysql-data:
  tdengine-data:
  redis-data:
  kafka-data:
  emqx-data:
  emqx-log:
  minio-data:
  es-data:
  nacos-data:

services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: onepark-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [onepark]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:${REDIS_VERSION}
    container_name: onepark-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks: [onepark]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  tdengine:
    image: tdengine/tdengine:${TDENGINE_VERSION}
    container_name: onepark-tdengine
    restart: unless-stopped
    environment:
      TAOS_FQDN: tdengine
      TZ: Asia/Shanghai
    ports:
      - "${TDENGINE_PORT}:6030"
      - "${TDENGINE_REST_PORT}:6041"
    volumes:
      - tdengine-data:/var/lib/taos
    networks: [onepark]
    healthcheck:
      test: ["CMD", "taos", "-s", "SHOW DATABASES"]
      interval: 15s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:${KAFKA_VERSION}
    container_name: onepark-kafka
    restart: unless-stopped
    environment:
      # KRaft 模式, 不依赖 ZooKeeper
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${KAFKA_PORT}:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10

  emqx:
    image: emqx/emqx:${EMQX_VERSION}
    container_name: onepark-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: onepark
      EMQX_HOST: emqx
    ports:
      - "${EMQX_MQTT_PORT}:1883"      # MQTT
      - "${EMQX_WS_PORT}:8083"         # MQTT/WS
      - "${EMQX_DASHBOARD_PORT}:18083" # Dashboard
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks: [onepark]
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:${NACOS_VERSION}
    container_name: onepark-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 512m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_VALUE}
    ports:
      - "${NACOS_HTTP_PORT}:8848"
      - "${NACOS_GRPC_PORT}:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio:
    image: coollabsio/minio:latest
    container_name: onepark-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    networks: [onepark]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:${ES_VERSION}
    container_name: onepark-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      ELASTIC_PASSWORD: ${ES_PASSWORD}
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
