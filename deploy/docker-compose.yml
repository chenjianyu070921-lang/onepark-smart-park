# OnePark 智慧园区 - 一键开发环境(中间件 + 业务服务 device-service)
# 启动: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example up -d
# 查看健康: docker compose -f deploy/docker-compose.yml ps
# 停止: docker compose -f deploy/docker-compose.yml down
networks:
  onepark:
    driver: bridge

volumes:
  mysql-data:
  tdengine-data:
  redis-data:
  kafka-data:
  emqx-data:
  emqx-log:
  minio-data:
  es-data:
  nacos-data:

services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: onepark-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./sql/sys.sql:/docker-entrypoint-initdb.d/sys.sql:ro
    networks: [onepark]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:${REDIS_VERSION}
    container_name: onepark-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks: [onepark]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  tdengine:
    image: tdengine/tdengine:${TDENGINE_VERSION}
    container_name: onepark-tdengine
    restart: unless-stopped
    environment:
      TAOS_FQDN: tdengine
      TAOS_PASSWORD: ${TDENGINE_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${TDENGINE_PORT}:6030"
      - "${TDENGINE_REST_PORT}:6041"
    volumes:
      - tdengine-data:/var/lib/taos
    networks: [onepark]
    healthcheck:
      test: ["CMD", "taos", "-s", "SHOW DATABASES"]
      interval: 15s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:${KAFKA_VERSION}
    container_name: onepark-kafka
    restart: unless-stopped
    environment:
      # KRaft 模式, 不依赖 ZooKeeper
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${KAFKA_PORT}:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10

  emqx:
    image: emqx/emqx:${EMQX_VERSION}
    container_name: onepark-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: onepark
      EMQX_HOST: emqx
    ports:
      - "${EMQX_MQTT_PORT}:1883"      # MQTT
      - "${EMQX_WS_PORT}:8083"         # MQTT/WS
      - "${EMQX_DASHBOARD_PORT}:18083" # Dashboard
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks: [onepark]
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:${NACOS_VERSION}
    container_name: onepark-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 512m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_VALUE}
    ports:
      - "${NACOS_HTTP_PORT}:8848"
      - "${NACOS_GRPC_PORT}:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio:
    image: coollabsio/minio:latest
    container_name: onepark-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:${ES_VERSION}
    container_name: onepark-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      ELASTIC_PASSWORD: ${ES_PASSWORD}
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---- 业务服务: device-service (M1 设备管理, 依赖 MySQL + Redis) ----
  device-service:
    build:
      context: ..                 # 仓库根, 保证 go.work 全模块可见
      dockerfile: app/device-service/Dockerfile
    image: onepark/device-service:latest
    container_name: onepark-device-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 容器内中间件主机名固定为服务名; 敏感值来自 .env.example
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-device_db}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${DEVICE_SERVICE_PORT:-8001}:8001"
    networks: [onepark]
    healthcheck:
      # go-zero rest 无内置 /ping, 探测根路径(服务监听即返回 HTTP 响应)作为存活探针.
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 业务服务: user-manage (M2 用户管理 RBAC, 依赖 MySQL) ----
  user-manage:
    build:
      context: ..
      dockerfile: app/user-manage/Dockerfile
    image: onepark/user-manage:latest
    container_name: onepark-user-manage
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sys_db}
    ports:
      - "${USER_MANAGE_PORT:-8086}:8086"
    networks: [onepark]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/"]
      interval: 15s
      timeout: 5s
      retries: 20
