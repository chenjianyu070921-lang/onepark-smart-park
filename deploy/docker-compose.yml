# OnePark 智慧园区 - 一键开发环境(中间件 + 业务服务 device-service)
# 启动: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example up -d
# 查看健康: docker compose -f deploy/docker-compose.yml ps
# 停止: docker compose -f deploy/docker-compose.yml down
networks:
  onepark:
    driver: bridge

volumes:
  mysql-data:
  tdengine-data:
  redis-data:
  kafka-data:
  emqx-data:
  emqx-log:
  minio-data:
  es-data:
  nacos-data:

services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: onepark-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 数据库初始化编排: 所有 DDL 作为只读数据挂载到 /sql-init,
      # 仅 run-all.sh 被 mysql 容器入口执行, 按"每服务独立库"模型建表.
      - ./sql:/sql-init:ro
      - ./sql/run-all.sh:/docker-entrypoint-initdb.d/run-all.sh:ro
    networks: [onepark]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:${REDIS_VERSION}
    container_name: onepark-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks: [onepark]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  tdengine:
    image: tdengine/tdengine:${TDENGINE_VERSION}
    container_name: onepark-tdengine
    restart: unless-stopped
    environment:
      TAOS_FQDN: tdengine
      TAOS_PASSWORD: ${TDENGINE_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${TDENGINE_PORT}:6030"
      - "${TDENGINE_REST_PORT}:6041"
    volumes:
      - tdengine-data:/var/lib/taos
    networks: [onepark]
    healthcheck:
      test: ["CMD", "taos", "-s", "SHOW DATABASES"]
      interval: 15s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:${KAFKA_VERSION}
    container_name: onepark-kafka
    restart: unless-stopped
    environment:
      # KRaft 模式, 不依赖 ZooKeeper
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${KAFKA_PORT}:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # 一次性任务: 等 kafka 健康后创建业务 topic(幂等, 重复运行安全). 各业务服务可直接向这些 topic 生产/消费.
  kafka-init:
    image: bitnami/kafka:${KAFKA_VERSION}
    container_name: onepark-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_REPLICATION_FACTOR: "1"
    command: ["/scripts/init-topics.sh"]
    volumes:
      - ./kafka/init-topics.sh:/scripts/init-topics.sh:ro
    networks: [onepark]

  emqx:
    image: emqx/emqx:${EMQX_VERSION}
    container_name: onepark-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: onepark
      EMQX_HOST: emqx
    ports:
      - "${EMQX_MQTT_PORT}:1883"      # MQTT
      - "${EMQX_WS_PORT}:8083"         # MQTT/WS
      - "${EMQX_DASHBOARD_PORT}:18083" # Dashboard
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks: [onepark]
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:${NACOS_VERSION}
    container_name: onepark-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 512m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_VALUE}
    ports:
      - "${NACOS_HTTP_PORT}:8848"
      - "${NACOS_GRPC_PORT}:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio:
    image: coollabsio/minio:latest
    container_name: onepark-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:${ES_VERSION}
    container_name: onepark-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      ELASTIC_PASSWORD: ${ES_PASSWORD}
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---- 业务服务: device-service (M1 设备管理, 依赖 MySQL + Redis) ----
  device-service:
    build:
      context: ..                 # 仓库根, 保证 go.work 全模块可见
      dockerfile: Dockerfile       # 仓库根统一参数化模板
      args:
        SVC_DIR: app/device-service
        MAIN: device.go
        PORT: 8001
        CFG: device-api.yaml
    image: onepark/device-service:latest
    container_name: onepark-device-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # 容器内中间件主机名固定为服务名; 敏感值来自 .env.example
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-device_db}
      MYSQL_DSN: ${DEVICE_MYSQL_DSN}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # HTTP 事件降级通道(/device/event)直投 Kafka, 不注入时 config 默认 localhost:9092,
      # 容器内必然连不上 broker, 表现为事件上报静默失败.
      KAFKA_BROKERS: ${KAFKA_BROKERS}
    ports:
      - "${DEVICE_SERVICE_PORT:-8001}:8001"
    networks: [onepark]
    healthcheck:
      # go-zero rest 无内置 /ping, 探测根路径(服务监听即返回 HTTP 响应)作为存活探针.
      # 连接级探活: go-zero rest 未注册 "/" 路由(返回 404), 用 TCP 连通性判存活, 避免 wget 因 404 误判不健康.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8001 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 业务服务: user-manage (M2 用户管理 RBAC, 依赖 MySQL) ----
  user-manage:
    build:
      context: ..
      dockerfile: Dockerfile       # 仓库根统一参数化模板
      args:
        SVC_DIR: app/user-manage
        MAIN: usermanage.go
        PORT: 8086
        CFG: usermanage-api.yaml
    image: onepark/user-manage:latest
    container_name: onepark-user-manage
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sys_db}
    ports:
      - "${USER_MANAGE_PORT:-8086}:8086"
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8086 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 对外统一入口: gateway (apigateway, 端口 8080) ----
  # 上游地址通过 Nacos 配置中心动态拉取(见 deploy/nacos/gateway-upstreams.json);
  # 未配置 NACOS_ADDRESS 时回退到静态 apigateway-api.yaml(本地联调行为不变).
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: gateway
        MAIN: apigateway.go
        PORT: 8080
        CFG: apigateway-api.yaml
    image: onepark/gateway:latest
    container_name: onepark-gateway
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      workorder-service:
        condition: service_healthy
      alarm-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
      leasing-service:
        condition: service_healthy
      dashboard-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
      user-manage:
        condition: service_healthy
    environment:
      # 启用 Nacos 动态上游: 网关从 Nacos 拉取 gateway-upstreams 并支持热更新.
      NACOS_ADDRESS: ${NACOS_ADDRESS:-nacos:8848}
      NACOS_NS: ${NACOS_NS:-onepark}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      # 网关鉴权密钥必须与 auth-service 的 JWT_SECRET 一致, 否则无法校验 Token.
      AUTH_SECRET: ${JWT_SECRET}
      # 网关运行模式: pre/prod 强制开启鉴权(dev/test 关闭便于联调); 见 apigateway-api.yaml 的 ${GATEWAY_MODE}.
      GATEWAY_MODE: ${GATEWAY_MODE:-pre}
      # 限流 + Token 注销黑名单 Redis: 对应 apigateway-api.yaml 的 ${REDIS_ADDR}/${REDIS_PASS};
      # 与 redis 容器 requirepass(REDIS_PASSWORD) 一致. 此前漏注入, 部署态 Redis 无密码连不上,
      # 导致限流与黑名单 IsRevoked 全部静默降级放行(Token 失效机制在 prod 被击穿).
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASS: ${REDIS_PASS}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 鉴权服务: auth-service (M6, 端口 8088, 依赖 MySQL sys_db) ----
  auth-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: app/auth-service
        MAIN: auth.go
        PORT: 8088
        CFG: auth-api.yaml
    image: onepark/auth-service:latest
    container_name: onepark-auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_MYSQL_DSN: ${AUTH_MYSQL_DSN}
      # 令牌注销黑名单 Redis: 对应 auth-api.yaml 的 ${AUTH_REDIS_ADDR}/${AUTH_REDIS_PASS};
      # 与 redis 容器 requirepass(REDIS_PASSWORD) 一致. 留空则注销降级为无操作.
      AUTH_REDIS_ADDR: ${AUTH_REDIS_ADDR}
      AUTH_REDIS_PASS: ${AUTH_REDIS_PASS}
    ports:
      - "${AUTH_SERVICE_PORT:-8088}:8088"
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8088 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 业务服务: workorder-service (M6 工单, 端口 8082, 依赖 MySQL+Redis+Kafka) ----
  workorder-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: app/workorder-service
        MAIN: workorder.go
        PORT: 8082
        CFG: workorder-api.yaml
    image: onepark/workorder-service:latest
    container_name: onepark-workorder-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      WORKORDER_MYSQL_DSN: ${WORKORDER_MYSQL_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASS: ${REDIS_PASS}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
    ports:
      - "${WORKORDER_SERVICE_PORT:-8082}:8082"
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8082 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 业务服务: alarm-service (M6 安防告警, 端口 8009, 依赖 MySQL+Redis+Kafka) ----
  alarm-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: app/alarm-service
        MAIN: alarm.go
        PORT: 8009
        CFG: alarm-api.yaml
    image: onepark/alarm-service:latest
    container_name: onepark-alarm-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ALARM_MYSQL_DSN: ${ALARM_MYSQL_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASS: ${REDIS_PASS}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      ALARM_KAFKA_GROUP: ${ALARM_KAFKA_GROUP}
    ports:
      - "${ALARM_SERVICE_PORT:-8009}:8009"
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8009 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 业务服务: dispatch-service (M5/M6 指挥调度, 端口 8053, 依赖 MySQL+Redis) ----
  dispatch-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: app/dispatch-service
        MAIN: dispatch.go
        PORT: 8053
        CFG: dispatch-api.yaml
    image: onepark/dispatch-service:latest
    container_name: onepark-dispatch-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DISPATCH_MYSQL_DSN: ${DISPATCH_MYSQL_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASS: ${REDIS_PASS}
    ports:
      - "${DISPATCH_SERVICE_PORT:-8053}:8053"
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8053 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 业务服务: leasing-service (M5/M6 运营招商, 端口 8051, 依赖 MySQL+Redis) ----
  leasing-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: app/leasing-service
        MAIN: leasing.go
        PORT: 8051
        CFG: leasing-api.yaml
    image: onepark/leasing-service:latest
    container_name: onepark-leasing-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LEASING_MYSQL_DSN: ${LEASING_MYSQL_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASS: ${REDIS_PASS}
    ports:
      - "${LEASING_SERVICE_PORT:-8051}:8051"
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8051 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 业务服务: dashboard-service (M5/M6 运营大屏, 端口 8052, 依赖 MySQL+Redis) ----
  dashboard-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: app/dashboard-service
        MAIN: dashboard.go
        PORT: 8052
        CFG: dashboard-api.yaml
    image: onepark/dashboard-service:latest
    container_name: onepark-dashboard-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DASHBOARD_MYSQL_DSN: ${DASHBOARD_MYSQL_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASS: ${REDIS_PASS}
      # 四路聚合数据源的 gRPC 端点: 容器内必须用服务 DNS 名(127.0.0.1 指向本容器自身).
      # 各上游 gRPC 由独立进程/端口提供: workorder 9091 / alarm 9009 / energy-data 9061 / device 9001.
      DEVICE_RPC_ENDPOINTS: ${DEVICE_RPC_ENDPOINTS}
      WORKORDER_RPC_ENDPOINTS: ${WORKORDER_RPC_ENDPOINTS}
      ALARM_RPC_ENDPOINTS: ${ALARM_RPC_ENDPOINTS}
      ENERGY_DATA_RPC_ENDPOINTS: ${ENERGY_DATA_RPC_ENDPOINTS}
    ports:
      - "${DASHBOARD_SERVICE_PORT:-8052}:8052"
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8052 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 业务服务: billing-service (M2/M6 计费, 端口 8063, 依赖 Redis) ----
  billing-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: app/billing-service
        MAIN: billing.go
        PORT: 8063
        CFG: billing-api.yaml
    image: onepark/billing-service:latest
    container_name: onepark-billing-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASS: ${REDIS_PASS}
    ports:
      - "${BILLING_SERVICE_PORT:-8063}:8063"
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8063 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 业务服务: parking-service (M2 停车, 端口 8084, 依赖 MySQL+Redis+Kafka) ----
  parking-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: app/parking-service
        MAIN: parking.go
        PORT: 8084
        CFG: parking-api.yaml
    image: onepark/parking-service:latest
    container_name: onepark-parking-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PARKING_MYSQL_DSN: ${PARKING_MYSQL_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASS: ${REDIS_PASS}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
    ports:
      - "${PARKING_SERVICE_PORT:-8084}:8084"
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8084 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---- 业务服务: visitor-service (M2 访客, 端口 8083, 依赖 MySQL+Redis+Kafka) ----
  visitor-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SVC_DIR: app/visitor-service
        MAIN: visitor.go
        PORT: 8083
        CFG: visitor-api.yaml
    image: onepark/visitor-service:latest
    container_name: onepark-visitor-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      VISITOR_MYSQL_DSN: ${VISITOR_MYSQL_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASS: ${REDIS_PASS}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      DEVICE_RPC_ENDPOINTS: ${DEVICE_RPC_ENDPOINTS}
    ports:
      - "${VISITOR_SERVICE_PORT:-8083}:8083"
    networks: [onepark]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8083 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

