Name: apigateway-api
Host: 0.0.0.0
Port: 8080

# 无鉴权联调默认园区ID(生产由 M6 鉴权后经 Header 注入 x-tenant-id 覆盖)
DefaultTenantId: 1
DefaultUserId: 0

# 路由前缀 -> 上游服务(最长前缀优先匹配)
# 说明: /api/workorder 前缀同时覆盖 /api/workorders 与 /api/workorder/:id
Upstreams:
  - Prefix: /api/workorder
    Target: http://127.0.0.1:8091
  - Prefix: /api/visitor
    Target: http://127.0.0.1:8092
  - Prefix: /api/parking
    Target: http://127.0.0.1:8093
  - Prefix: /api/notice
    Target: http://127.0.0.1:8094
  # ===== M5 运营招商 + 指挥调度 =====
  # 端口口径: 按《接口与链路技术点清单》(8051/8052/8053), 与 M2 实际使用的 8091(清单口径)一致.
  - Prefix: /api/leasing
    Target: http://127.0.0.1:8051
  - Prefix: /api/dashboard
    Target: http://127.0.0.1:8052
  - Prefix: /api/dispatch
    Target: http://127.0.0.1:8053

  # 大屏 WebSocket 实时推送(清单 #73)。
  # 路径打全 /ws/dashboard 而不是 /ws —— 网关是最长前缀优先匹配,
  # 若用 /ws, 将来 M3 的 WebSocket 会被一并转发到 M5, 造成冲突。
  # 标准库 httputil.ReverseProxy 原生支持 Upgrade 转发, 无需改代理代码。
  - Prefix: /ws/dashboard
    Target: http://127.0.0.1:8052
