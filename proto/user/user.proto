syntax = "proto3";

package onepark.user;

option go_package = "onepark/proto/user;userpb";

import "common/common.proto";

service UserManage {
  // Ping 健康检查
  rpc Ping(onepark.common.Empty) returns (onepark.common.Empty);

  // UserCreate 新建用户(bcrypt 加密密码)
  rpc UserCreate(CreateUserReq) returns (CreateUserResp);

  // UserUpdate 更新用户资料(昵称/状态)
  rpc UserUpdate(UpdateUserReq) returns (onepark.common.Empty);

  // UserDelete 删除用户
  rpc UserDelete(UserDeleteReq) returns (onepark.common.Empty);

  // UserDetail 查询单用户详情
  rpc UserDetail(UserDetailReq) returns (UserInfo);

  // UserList 分页列出用户
  rpc UserList(onepark.common.Empty) returns (UserListResp);

  // CheckPermission 校验用户是否拥有某 permission(用户->角色->菜单权限汇总).
  // 由网关在写操作前统一调用; 以网关注入的已鉴权 user_id 为准(调用方为网关, 可信).
  rpc CheckPermission(CheckPermissionReq) returns (CheckPermissionResp);
}

message UserInfo {
  uint64 id = 1;
  string username = 2;
  string nickname = 3;
  int32  status = 4;
  string created_at = 5;
}

message UserListResp {
  repeated UserInfo list = 1;
  int64 total = 2;
}

message CreateUserReq {
  string username = 1;
  string password = 2;
  string nickname = 3;
  int32  status = 4;
}

message CreateUserResp {
  uint64 id = 1;
}

message UpdateUserReq {
  uint64 id = 1;
  string nickname = 2;
  int32  status = 3;
}

message UserDeleteReq {
  uint64 id = 1;
}

message UserDetailReq {
  uint64 id = 1;
}

// CheckPermissionReq 权限校验请求: 由网关传入已鉴权的 user_id 与目标 permission.
message CheckPermissionReq {
  uint64 user_id = 1;   // 网关注入的已鉴权用户ID(调用方为网关, 可信)
  string permission = 2; // 目标权限串, 形如 user:write / role:read(见部署脚本 sys_menu.permission)
}

// CheckPermissionResp 权限校验响应.
message CheckPermissionResp {
  bool allowed = 1; // true=允许, false=无权限
}
